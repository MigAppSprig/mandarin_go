# MandarinGo — Nginx 静态站点配置示例
#
# 用法：
#   1. 把 build/web/ 里的文件上传到 /var/www/mandarin_go/
#   2. 把本文件放到 /etc/nginx/conf.d/mandarin_go.conf（或 sites-available 并软链）
#   3. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # 换成你的域名；没有域名就填服务器公网 IP
    server_name your-domain.com;

    root /var/www/mandarin_go;
    index index.html;

    # Flutter 是单页应用：找不到的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location ~* \.(js|css|png|jpe?g|gif|ico|svg|woff2?|ttf|m4a|wasm)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 压缩（减少首屏体积）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;
}

