name: mandarin_go
description: "A Mandarin Chinese learning app for English speakers: pinyin basics, flashcards, dialogues, and an English-to-Chinese translator with pinyin and audio."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Text-to-speech for Chinese pronunciation (uses system TTS with zh-CN).
  flutter_tts: ^4.2.0
  # Local persistence for learning progress / flashcard SRS state.
  shared_preferences: ^2.3.0
  # Lightweight state management.
  provider: ^6.1.2
  pinyin: ^3.3.0
  http: ^1.6.0
  audioplayers: ^6.8.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/pinyin/
